<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}{% endblock title %}-Dashboard</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/remixicon/4.6.0/remixicon.css">
</head>

<body class="bg-gray-50">
  
        
    {% include "header.html" %}

    <main class="w-[80%] mx-auto">
        <div class="mt-16">
           <section class="card-container">
                <div class="grid grid-cols-4 gap-4">
                    <div class="card shadow-lg bg-white rounded-lg p-4 flex flex-col gap-3">
                        <h3 class="text-gray-500 font-bold">TOTAL TASK</h3>
                        <div class=" flex justify-between">
                            <p class="font-bold text-3xl">3</p>
                            <div class="h-10 w-10 bg-blue-200 rounded-full flex justify-center items-center ">
                                <!-- <i class="ri-clipboard-line text-blue-600 font-bold text-xl"></i> -->
                                <i class="ri-clipboard-line text-blue-600 font-bold text-xl"></i>
                            </div>
                        </div>
                        <p class="font-bold text-gray-500">111 last month</p>
                    </div>


                    <div class="card shadow-lg bg-white rounded-lg p-4 flex flex-col gap-3">
                        <h3 class="text-gray-500 font-bold uppercase">completed task</h3>
                        <div class=" flex justify-between">
                            <p class="font-bold text-3xl">1</p>
                            <div class="h-10 w-10 bg-green-200 rounded-full flex justify-center items-center ">
                                <i class="ri-checkbox-circle-line font-bold text-green-600 text-xl"></i>
                            </div>
                        </div>
                        <p class="font-bold text-gray-500">111 last month</p>
                    </div>



                    <div class="card shadow-lg bg-white rounded-lg p-4 flex flex-col gap-3">
                        <h3 class="text-gray-500 font-bold uppercase">task in progress</h3>
                        <div class=" flex justify-between">
                            <p class="font-bold text-3xl">1</p>
                            <div class="h-10 w-10 bg-yellow-100 rounded-full flex justify-center items-center ">
                                <i class="ri-time-line font-bold text-yellow-600 text-xl"></i>
                            </div>
                        </div>
                        <p class="font-bold text-gray-500">111 last month</p>
                    </div>


                    <div class="card shadow-lg bg-white rounded-lg p-4 flex flex-col gap-3">
                        <!-- <h3 class="text-gray-500 font-bold">todos</h3> -->
                        <h3 class="text-gray-500 font-bold uppercase">todos</h3>
                        <div class=" flex justify-between">
                            <p class="font-bold text-3xl">3</p>
                            <div class="h-10 w-10 bg-purple-100 rounded-full flex justify-center items-center ">
                                <i class="ri-clipboard-line text-purple-600 font-bold text-xl"></i>
                            </div>
                        </div>
                        <p class="font-bold text-gray-500">111 last month</p>
                    </div>


                </div>
            </section>


           {% block tasks %}{% endblock tasks %}
        </div>
    </main>
</body>

</html>
